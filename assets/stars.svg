<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160">
  <defs>
    <linearGradient id="trailT" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trailG" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- twinkling dots -->
  <g>
    <circle cx="90" cy="38" r="1.6" fill="#2DD4BF"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="112" r="1.3" fill="#F59E0B"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="52" r="1.8" fill="#2DD4BF"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="128" r="1.2" fill="#2DD4BF"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="34" r="1.5" fill="#F59E0B"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="775" cy="96" r="1.7" fill="#2DD4BF"><animate attributeName="opacity" values="1;0.15;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="48" r="1.3" fill="#2DD4BF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1035" cy="118" r="1.6" fill="#F59E0B"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="62" r="1.4" fill="#2DD4BF"><animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting stars -->
  <g opacity="0.95">
    <g>
      <line x1="-88" y1="-15" x2="0" y2="0" stroke="url(#trailT)" stroke-width="2.4"/>
      <circle r="2.6" fill="#2DD4BF"/>
      <animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" path="M -120,-10 L 1320,230"/>
    </g>
    <g>
      <line x1="-70" y1="-12" x2="0" y2="0" stroke="url(#trailG)" stroke-width="2"/>
      <circle r="2.1" fill="#F59E0B"/>
      <animateMotion dur="4.1s" begin="1.1s" repeatCount="indefinite" path="M -140,30 L 1340,260"/>
    </g>
    <g>
      <line x1="-95" y1="-16" x2="0" y2="0" stroke="url(#trailT)" stroke-width="2.6"/>
      <circle r="2.9" fill="#2DD4BF"/>
      <animateMotion dur="2.6s" begin="2s" repeatCount="indefinite" path="M -110,-40 L 1330,180"/>
    </g>
    <g>
      <line x1="-60" y1="-10" x2="0" y2="0" stroke="url(#trailT)" stroke-width="1.8"/>
      <circle r="1.8" fill="#2DD4BF"/>
      <animateMotion dur="5s" begin="0.6s" repeatCount="indefinite" path="M -100,70 L 1340,300"/>
    </g>
    <g>
      <line x1="-80" y1="-14" x2="0" y2="0" stroke="url(#trailG)" stroke-width="2.2"/>
      <circle r="2.3" fill="#F59E0B"/>
      <animateMotion dur="3.7s" begin="2.8s" repeatCount="indefinite" path="M -130,-25 L 1310,205"/>
    </g>
    <g>
      <line x1="-75" y1="-13" x2="0" y2="0" stroke="url(#trailT)" stroke-width="2"/>
      <circle r="2" fill="#2DD4BF"/>
      <animateMotion dur="4.6s" begin="3.5s" repeatCount="indefinite" path="M -120,45 L 1320,285"/>
    </g>
  </g>
</svg>
